<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ish Booty Detector</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #050505;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 29, 72, .15), transparent 38rem),
        repeating-linear-gradient(135deg, transparent 0 18px, rgba(255,255,255,.018) 18px 36px),
        #050505;
    }
    main {
      width: min(1080px, calc(100% - 32px));
      padding: 48px 0;
      text-align: center;
    }
    .eyebrow {
      color: #777;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .32em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px auto 14px;
      max-width: 1000px;
      font-size: clamp(3.4rem, 11vw, 9rem);
      line-height: .82;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }
    .detected h1 {
      color: #ff1d48;
      text-shadow: 0 0 14px rgba(255,29,72,.55), 0 0 60px rgba(255,29,72,.28);
      animation: pulse .9s ease-in-out infinite alternate;
    }
    .status-line {
      margin: 24px 0 38px;
      color: #aaa;
      font-size: 1rem;
    }
    @keyframes pulse {
      from { transform: scale(1); filter: brightness(.9); }
      to { transform: scale(1.018); filter: brightness(1.18); }
    }
    @media (max-width: 680px) {
      main { padding: 34px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .detected h1 { animation: none; }
    }
  </style>
</head>
<body>
  <main id="screen">
    <div class="eyebrow">EUNE Live Match Surveillance</div>
    <h1 id="headline">Scanning for booty…</h1>
    <p class="status-line" id="status-line">Connecting to the detector</p>
  </main>
  <script>
    const screen = document.querySelector("#screen");
    const headline = document.querySelector("#headline");
    const statusLine = document.querySelector("#status-line");
    async function refresh() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error("Status unavailable");
        const data = await response.json();

        screen.classList.toggle("detected", data.detected);
        headline.textContent = data.detected
          ? "ISH BOOTY DETECTED"
          : "ISH BOOTY IS OFFLINE";
        statusLine.textContent = data.detected
          ? "Target has entered a League of Legends map."
          : "Target is currently outside detectable matches.";
      } catch (error) {
        headline.textContent = "DETECTOR OFFLINE";
        statusLine.textContent = "The live status service could not be reached.";
      }
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
